spring:
  banner:
    location: classpath:banner.txt
    mode: console
  application:
    name: x-inventory-service
server:
  port : 8085

x:
  http:
    logging:
      enabled: true
      server: x-inventory-service
      hop: "x-api-gateway → x-bff → x-inventory-service"
      hops:
        /api/v1/stock: "x-api-gateway → x-bff → x-inventory-service"
        /api/v1/home: "x-api-gateway → x-bff → x-inventory-service"

inventory:
  reservations:
    expiry-scan-ms: ${INVENTORY_RESERVATION_EXPIRY_SCAN_MS:60000}

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://x-product-service:8082}
